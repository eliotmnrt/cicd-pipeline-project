name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo
  K8S_DEPLOYMENT: cicd-demo

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Kubernetes cluster (Kind)
        uses: helm/kind-action@v1
        with:
          version: 'v0.22.0'
      
      - name: Check cluster status
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Update K8s manifests
        run: |
          sed -i "s|GITHUB_SHA|${{ github.sha }}|g" k8s/deployment.yaml
          cat k8s/deployment.yaml
      
      - name: Deploy info
        run: |
          echo "✅ Tests passed"
          echo "✅ Docker image built: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "✅ K8s manifests updated"
          echo ""
          echo "To deploy to your cluster, run:"
          kubectl cluster-info
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          
      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} --timeout=120s

      - name: Get Deployed SHA Version
        run: |
          # 1. Lance le port-forward en arrière-plan
          kubectl port-forward svc/cicd-demo 3000:80 &
          
          # 2. Laisse le temps au tunnel de s'établir (très important en CI)
          sleep 3
          
          # 3. Interroge l'API et extrait la version avec jq
          DEPLOYED=$(curl -s http://localhost:3000/)
          
          echo "Deployed version: $DEPLOYED"